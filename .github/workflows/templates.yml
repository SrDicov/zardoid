name: Templates

# Cola -> generación -> xlint -> build real -> merge.
# Un push a la cola, el cron cada 30 min o un dispatch procesan un lote de
# LOTE entradas. Solo se copia a srcpkgs/ lo que pasa xlint Y compila con
# xbps-src; el resto se anota en meta/failed.list y sale de la cola para no
# bloquear al siguiente lote.
#
# El push final lo hace GITHUB_TOKEN, y los pushes con ese token no disparan
# workflows: no hay bucle.

on:
  push:
    branches: [main]
    paths:
      - 'meta/requests.list'
      - 'meta/belka.tsv'
      - 'meta/maintainer'
      - 'scripts/gen-queue.sh'
      - 'scripts/merge-validated.sh'
      - 'scripts/import-belka.sh'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: templates
  cancel-in-progress: false

env:
  VOID_IMAGE: ghcr.io/void-linux/void-glibc-full
  LOTE: 20

jobs:
  generate:
    name: Generar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      count: ${{ steps.q.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - id: q
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/import-belka.sh
          sh scripts/gen-queue.sh staging
          echo "count=$(wc -l <staging/map.tsv | tr -d ' ')" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: staging
          path: |
            staging
            !staging/.cache
          retention-days: 7
      - name: Resumen
        run: cat staging/summary.md >>"$GITHUB_STEP_SUMMARY"

  validate:
    name: xlint
    needs: generate
    if: needs.generate.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging
      - name: xlint + bash -n
        run: |
          : >validated.txt
          docker run --rm -v "$PWD:/w" -w /w "$VOID_IMAGE" sh -c '
            set -e
            xbps-install -Sy bash >/dev/null
            mkdir -p /etc/xbps.d
            cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
            sed -i "s|repo-default|repo-ci|g" /etc/xbps.d/*-repository-*.conf 2>/dev/null || true
            xbps-install -Syu xbps >/dev/null
            xbps-install -yu >/dev/null
            xbps-install -y xtools jq >/dev/null
            for d in staging/srcpkgs/*/; do
              [ -f "$d/template" ] || continue
              pkg=$(basename "$d")
              if ! bash -n "$d/template"; then
                echo "bash -n FALLO: $pkg"
                continue
              fi
              if (cd "$d" && xlint template); then
                echo "$pkg" >>validated.txt
              else
                echo "xlint FALLO: $pkg"
              fi
            done
          '
      - uses: actions/upload-artifact@v4
        with:
          name: validated
          path: validated.txt
          retention-days: 7
      - name: Exigir al menos uno
        run: |
          if [ ! -s validated.txt ]; then
            echo "ningún template pasó la validación"
            exit 1
          fi
          echo "validados: $(wc -l <validated.txt | tr -d ' ')"

  build:
    name: Compilar
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging
      - uses: actions/download-artifact@v4
        with:
          name: validated
          path: .
      - name: xbps-src pkg
        run: |
          : >built.txt
          # ethereal: el propio contenedor es el masterdir. uunshare necesita
          # user namespaces, que el docker de Actions no deja usar.
          docker run --rm --privileged -v "$PWD:/w" -v /dev:/dev -w /w "$VOID_IMAGE" sh -c '
            set -e
            xbps-install -Sy bash git curl base-devel file binutils >/dev/null
            command -v file objdump
            git clone --depth 1 https://github.com/void-linux/void-packages /w/vp
            cp -r staging/srcpkgs/* /w/vp/srcpkgs/
            cd /w/vp
            ln -sfn / masterdir
            export XBPS_CHROOT_CMD=ethereal XBPS_ALLOW_CHROOT_BREAKOUT=yes
            while read -r pkg; do
              [ -n "$pkg" ] || continue
              if ./xbps-src -Q pkg "$pkg"; then
                echo "$pkg" >>/w/built.txt
              else
                echo "build FALLO: $pkg"
              fi
            done </w/validated.txt
          '
      - name: Exigir al menos uno
        run: |
          if [ ! -s built.txt ]; then
            echo "ningún template compiló"
            exit 1
          fi
          echo "compilados: $(wc -l <built.txt | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: built.txt
          retention-days: 7

  merge:
    name: Merge
    needs: [generate, validate, build]
    # Si no validó o no compiló NADA, huele a infraestructura: no se vacía la
    # cola. Si no hay nada que generar (count 0), validate/build se saltan y
    # sí se anotan los fallos de generación.
    if: >-
      always() && needs.generate.result == 'success' &&
      needs.validate.result != 'failure' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: validated
          path: .
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: built
          path: .
      - name: Copiar validados
        run: |
          sh scripts/import-belka.sh
          sh scripts/merge-validated.sh staging validated.txt built.txt
      - name: Commit
        run: |
          git config user.name "zardoid-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add srcpkgs meta/requests.list meta/failed.list meta/belka.imported
          if git diff --cached --quiet; then
            echo "nada que mergear"
            exit 0
          fi
          pkgs=$(git diff --cached --name-only -- 'srcpkgs/*/template' | awk -F/ '{print $2}' | tr '\n' ' ')
          git commit -m "templates: ${pkgs}"
          git push
      - name: Siguiente lote
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -v '^#' meta/requests.list | grep -q .; then
            echo "cola vacía: fin"
            exit 0
          fi
          gh workflow run Templates --ref main || echo "no se pudo encadenar (usa workflow_dispatch)" 
